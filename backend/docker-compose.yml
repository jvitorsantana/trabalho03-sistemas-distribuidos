services:
  postgres:
    image: postgres:16
    container_name: audio_postgres
    restart: always
    environment:
      POSTGRES_USER: audio_user
      POSTGRES_PASSWORD: audio_pass
      POSTGRES_DB: audio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: