services:
  postgres:
    image: postgres:16
    container_name: audio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: audio_user
      POSTGRES_PASSWORD: audio_pass
      POSTGRES_DB: audio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audio_user -d audio_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: audio_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://audio_user:audio_pass@postgres:5432/audio_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
